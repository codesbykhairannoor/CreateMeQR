name: Daily Search Engine & Google Indexing Automation

on:
  schedule:
    # Runs daily at 02:00 UTC (09:00 AM WIB)
    - cron: '0 2 * * *'
  workflow_dispatch: # Allows manual trigger from GitHub Actions UI
  push:
    branches:
      - main
    paths:
      - '.github/workflows/**'

jobs:
  index-pages:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      GCP_SA_KEY: ${{ secrets.GCP_SA_KEY }}
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          persist-credentials: true

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci || npm install

      - name: Ping IndexNow (Bing, Yandex, Seznam, Naver)
        run: npm run indexnow

      - name: Submit Daily Batch to Google Indexing API
        if: env.GCP_SA_KEY != ''
        run: npm run index:google -- --limit=200

      - name: Commit and Push Queue State
        if: always()
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add google-indexing-state.json
          git diff --staged --quiet || git commit -m "chore(seo): update automated daily google indexing queue state [skip ci]"
          git push origin main || true

