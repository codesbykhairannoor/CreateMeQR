name: Search Engine IndexNow (Manual Trigger Only)

on:
  # Daily Google Indexing cron disabled to avoid Indexing API misuse on non-JobPosting/BroadcastEvent pages.
  workflow_dispatch: # Manual trigger only from GitHub Actions UI

jobs:
  index-pages:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci || npm install

      - name: Ping IndexNow (Bing, Yandex, Seznam, Naver)
        run: npm run indexnow
